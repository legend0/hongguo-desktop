# electron-builder 打包配置（Windows：NSIS 安装包 + portable 便携版）
# 运行：npm run dist（= electron-vite build + electron-builder --win）
appId: com.hongguo.desktop
productName: 黑果短剧

directories:
  # 注：release\win-unpacked\resources\app.asar 被 IDE（WorkBuddy）锁定；
  # release2 同样被 WorkBuddy 锁定（Restart Manager 实锤 PID）；
  # release3 在打包期间有运行中的应用实例占用。暂用 release4；
  # 全部锁释放后可清理旧 release* 目录并改回
  output: release
  buildResources: build

# 依赖已全部打进 out/（vite 内联 data-server/axios/cheerio，渲染层自打包），
# 产物只带 out 与 package.json，不收集 node_modules
files:
  - out/**
  - package.json
  - "!**/*.map"

# 托盘图标：打包后位于 <安装目录>/resources/icon.png（主进程 process.resourcesPath 读取）
# ByteVC2 转码器：build/bytevc2/<arch>/ffmpeg.exe → <resources>/bytevc2/ffmpeg.exe
# （bytevc2-transcode.js binaryPath 打包态解析路径，与参考项目 extraResources 模式一致）
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: build/bytevc2/${arch}
    to: bytevc2

asar: true

# 依赖已全部内联进 out/（无原生模块），跳过 @electron/rebuild 与 node_modules 收集
npmRebuild: false
# GitHub Releases 发布源：electron-updater 读取 latest.yml 检查更新（任务 66）
publish:
  provider: github
  owner: legend0
  repo: hongguo-desktop

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: 黑果短剧
  # 产物名必须纯 ASCII：中文会被 electron-builder 清洗为包名形式（@hongguo.desktop-…），
  # 且 latest.yml 中会残留原始 `${name}` 的斜杠形态（@hongguo/desktop-…），与上传资产不一致
  # → 自动更新下载 404（v1.4.4 实测踩坑）。ASCII 名保证 yml url 与资产名完全一致
  artifactName: hongguo-Setup-${version}.${ext}

portable:
  artifactName: hongguo-Portable-${version}.${ext}
